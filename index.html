<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vibe Type is a free typing test and coach: timed tests, lessons from the home row, a finger-guide keyboard and weak-key practice.">
<meta property="og:title" content="Vibe Type">
<meta property="og:description" content="A free typing test and coach. Learn touch typing, track your speed, fix your weak keys.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 28'%3E%3Crect x='1' y='1' width='32' height='26' rx='6' fill='%231f2227'/%3E%3Crect x='6' y='6' width='22' height='16' rx='3.5' fill='%23f0a35e'/%3E%3Crect x='13' y='17' width='8' height='2' rx='1' fill='%231f2227'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Vibe Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lexend+Deca:wght@300;400;500;600&display=swap">
<style>
/* Layout: one calm centred column. The words are the hero; everything else recedes while you type. */
:root{
  --bg:#eef1f4; --surface:#e1e6eb; --text:#1d2733; --sub:#56616f; --accent:#b0501a;
  --error:#c0392b; --extra:#8a2a20; --ok:#2e7d4f; --warn:#9a6400;
  --font-ui:"Lexend Deca",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-type:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-pinky:rgba(214,96,140,.28); --f-ring:rgba(222,140,64,.28); --f-middle:rgba(200,176,50,.30);
  --f-indexl:rgba(70,170,110,.28); --f-indexr:rgba(60,150,190,.28); --f-thumb:rgba(140,140,150,.22);
  --radius:10px; --type-size:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f2227; --surface:#2a2e35; --text:#e6e2d8; --sub:#90959e; --accent:#f0a35e;
  --error:#f07167; --extra:#a9534d; --ok:#6cc58b; --warn:#e0b34a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f2227; --surface:#2a2e35; --text:#e6e2d8; --sub:#90959e; --accent:#f0a35e;
  --error:#f07167; --extra:#a9534d; --ok:#6cc58b; --warn:#e0b34a; color-scheme:dark}
/* Skins the person picks override the system theme */
:root[data-skin="dusk"]{--bg:#1f2227;--surface:#2a2e35;--text:#e6e2d8;--sub:#90959e;--accent:#f0a35e;--error:#f07167;--extra:#a9534d;--ok:#6cc58b;--warn:#e0b34a;color-scheme:dark}
:root[data-skin="daylight"]{--bg:#eef1f4;--surface:#e1e6eb;--text:#1d2733;--sub:#56616f;--accent:#b0501a;--error:#c0392b;--extra:#8a2a20;--ok:#2e7d4f;--warn:#9a6400;color-scheme:light}
:root[data-skin="lagoon"]{--bg:#0f2a2e;--surface:#16393e;--text:#dcefee;--sub:#80a8a8;--accent:#5ad1c0;--error:#ff7b72;--extra:#b4544f;--ok:#7ee0a0;--warn:#f2c14e;color-scheme:dark}
:root[data-skin="plum"]{--bg:#241b2f;--surface:#30253f;--text:#ece3f5;--sub:#a093b3;--accent:#e9a6d9;--error:#ff8a80;--extra:#b3605a;--ok:#8fd6a5;--warn:#f0c65a;color-scheme:dark}
:root[data-skin="forest"]{--bg:#1c231d;--surface:#263027;--text:#e3e8dc;--sub:#929e8c;--accent:#d1bb5c;--error:#ee7a60;--extra:#a65644;--ok:#8fcf87;--warn:#e7b85a;color-scheme:dark}
:root[data-skin="sakura"]{--bg:#fbeef2;--surface:#f2dbe2;--text:#3b2530;--sub:#7a5765;--accent:#b93a63;--error:#b3261e;--extra:#7d1b15;--ok:#2f7a4c;--warn:#94600a;color-scheme:light}
:root[data-skin="graphite"]{--bg:#111214;--surface:#1d1e21;--text:#f2f2f2;--sub:#9c9ea3;--accent:#9ecbff;--error:#ff6b6b;--extra:#a84848;--ok:#7bd88f;--warn:#f5c451;color-scheme:dark}
:root[data-skin="serika"]{--bg:#323437;--surface:#2c2e31;--text:#d1d0c5;--sub:#a0a2a4;--accent:#e2b714;--error:#e05d6a;--extra:#9c3f48;--ok:#8fcf87;--warn:#e2b714;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.app{max-width:1060px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:20px 16px}
.fade{transition:opacity .2s}
body.typing .fade{opacity:0;pointer-events:none}

/* header */
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand svg{width:34px;height:28px}
.brand b{font-weight:600;font-size:1.35rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.68rem;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-top:-4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--sub);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:.92rem}
nav a:hover{color:var(--text)}
nav a[aria-current="page"]{color:var(--text);background:var(--surface)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--sub);font-size:.85rem}
.goal{display:flex;align-items:center;gap:8px}
.goal .bar{width:70px;height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent);width:0}
.streak b{color:var(--accent);font-weight:600}
.kbtn{border:1px solid var(--surface);border-radius:6px;padding:3px 8px;font-size:.78rem;color:var(--sub)}
.kbtn:hover{color:var(--text)}
main{flex:1;display:flex;flex-direction:column;padding-top:28px}
.view[hidden]{display:none!important}

/* config bar */
.config{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;background:var(--surface);border-radius:var(--radius);padding:6px 10px;margin:0 auto;font-size:.85rem;color:var(--sub);max-width:100%}
.config .grp{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.config .sep{width:3px;height:18px;border-radius:2px;background:var(--bg);margin:0 6px;align-self:center}
.config button{padding:4px 9px;border-radius:6px;color:var(--sub)}
.config button:hover{color:var(--text)}
.config button[aria-pressed="true"]{color:var(--accent)}

/* test area */
.stage{position:relative;margin-top:36px}
.live{display:flex;gap:22px;align-items:baseline;font-family:var(--font-type);color:var(--accent);font-size:1.45rem;min-height:2.1rem;margin-bottom:6px}
.live span[hidden]{display:none}
.live .lv-dim{opacity:.75;font-size:1.1rem}
.wordsbox{position:relative;overflow:hidden;font-family:var(--font-type);font-size:var(--type-size);user-select:none;cursor:text}
.wordsinner{position:relative;transition:transform .14s ease-out}
.word{display:inline-block;margin:0 .55em .3em 0;line-height:1.45;color:var(--sub);border-bottom:2px solid transparent}
.word.err{border-bottom-color:var(--error)}
.l{position:relative}
.l.ok{color:var(--text)}
.l.bad{color:var(--error)}
.l.extra{color:var(--extra)}
body.blind .l.bad,body.blind .l.extra{color:var(--text)}
body.blind .word.err{border-bottom-color:transparent}
.caret{position:absolute;left:0;top:0;width:2px;background:var(--accent);border-radius:1px;pointer-events:none;animation:blink 1s step-end infinite}
.caret.smooth{transition:transform .09s linear}
.caret.block{width:.6em;opacity:.45;border-radius:2px}
.caret.outline{width:.6em;background:transparent;border:2px solid var(--accent);border-radius:3px}
.caret.underline{width:.6em;border-radius:1px}
.caret.off{display:none}
body.typing .caret{animation:none}
.pace{position:absolute;left:0;top:0;width:2px;background:var(--sub);opacity:.6;pointer-events:none;transition:transform .12s linear}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret.smooth,.pace,.wordsinner{transition:none}.caret{animation:none}}
.focusnote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);font-size:1rem;cursor:pointer;z-index:3}
.capsnote{position:absolute;top:-6px;right:0;background:var(--error);color:var(--bg);font-size:.8rem;padding:3px 10px;border-radius:6px}
.restart{display:flex;justify-content:center;margin-top:18px}
.restart button{color:var(--sub);padding:8px 14px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:.85rem}
.restart button:hover{color:var(--text);background:var(--surface)}
.lessonbanner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.88rem;color:var(--sub);margin-top:10px}
.lessonbanner b{color:var(--text);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--text)}
.chip.key{font-family:var(--font-type)}

/* keyboard */
.kbscroll{overflow-x:auto;display:flex;justify-content:safe center}
.kb{display:flex;flex-direction:column;gap:5px;align-items:center;margin:0 auto;width:max-content;font-family:var(--font-type);font-size:.82rem;user-select:none}
#kbHost{margin-top:34px}
@media (max-width:520px){#kbHost{display:none}.config .sep{display:none}.config{justify-content:flex-start}}
.kb .row{display:flex;gap:5px}
.kb .k{width:38px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--sub);background:var(--fc,var(--surface));border:1px solid transparent;position:relative;transition:background .12s,color .12s,transform .08s}
.kb.plain .k{background:var(--surface)}
.kb.compact .k{width:31px;height:31px;font-size:.72rem}.kb.compact .k.wide{width:48px}.kb.compact .k.xwide{width:60px}.kb.compact .k.space{width:200px}.kb.compact .row{gap:4px}.kb.compact{gap:4px}
.kb .k.wide{width:62px}.kb .k.xwide{width:78px}.kb .k.space{width:260px}
.kb .k.bump::after{content:"";position:absolute;bottom:5px;width:9px;height:2px;border-radius:1px;background:var(--sub)}
.kb .k.next{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.kb .k.hit{background:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--text);transform:translateY(1px)}
.kb .k.miss{background:color-mix(in srgb,var(--error) 50%,transparent);color:var(--text)}
.kb .k.new{border-color:var(--accent);color:var(--text)}
.kb .k.locked{opacity:.35}
.kb .k small{position:absolute;bottom:1px;font-size:.58rem;color:var(--text);opacity:.8}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:.75rem;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:720px){.kb .k{width:26px;height:30px;font-size:.7rem}.kb .k.wide{width:40px}.kb .k.xwide{width:48px}.kb .k.space{width:170px}.kb .row{gap:3px}.kb{gap:3px}}

/* results */
.results{display:grid;grid-template-columns:auto 1fr;gap:12px 36px;align-items:start}
.big{display:flex;flex-direction:column;gap:2px}
.big .lab{color:var(--sub);font-size:1.4rem;line-height:1}
.big .num{color:var(--accent);font-family:var(--font-type);font-size:3.6rem;line-height:1.05;font-variant-numeric:tabular-nums}
.big .pb{font-size:.78rem;color:var(--bg);background:var(--accent);border-radius:5px;padding:1px 8px;align-self:flex-start;margin-top:4px}
.chartwrap{min-width:0}
.chartwrap svg{width:100%;height:auto;display:block}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px 40px}
.stat .lab{color:var(--sub);font-size:.85rem}
.stat .val{color:var(--accent);font-family:var(--font-type);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat .val.sm{font-size:1rem;color:var(--text);font-family:var(--font-ui)}
.coach{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border-radius:var(--radius);padding:12px 16px;font-size:.9rem}
.coach .t{color:var(--sub)}
.history{grid-column:1/-1}
.history h3,.section h3{font-size:.85rem;font-weight:400;color:var(--sub);margin:0 0 8px}
.hwords{font-family:var(--font-type);font-size:1.05rem;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--text)}
.hwords .hw{border-bottom:2px solid transparent;position:relative}
.hwords .hw.err{border-bottom-color:var(--error)}
.hwords .hw .bad{color:var(--error)}.hwords .hw .extra{color:var(--extra)}.hwords .hw .miss{color:var(--sub)}
.hwords .hw[data-typed]:hover::after{content:attr(data-typed);position:absolute;bottom:110%;left:0;background:var(--text);color:var(--bg);font-size:.8rem;padding:2px 8px;border-radius:5px;white-space:nowrap}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--surface);color:var(--text);font-size:.88rem}
.btn:hover{background:color-mix(in srgb,var(--surface) 70%,var(--accent))}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,var(--text))}
.btn svg{width:16px;height:16px}
.btn.danger{color:var(--error)}
@media (max-width:720px){.results{grid-template-columns:1fr}.big{flex-direction:row;gap:24px;align-items:baseline}.big .num{font-size:2.6rem}}

/* lessons / progress / prefs */
.pagehead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:1.6rem;font-weight:500;margin:0;letter-spacing:-.01em;text-wrap:balance}
.pagehead p{margin:0;color:var(--sub);max-width:62ch}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lesson{background:var(--surface);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid transparent}
.lesson:hover{border-color:var(--accent)}
.lesson .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lesson .n{font-family:var(--font-type);color:var(--sub);font-size:.8rem}
.lesson .keys{font-family:var(--font-type);font-size:1.15rem;color:var(--text);letter-spacing:.08em}
.lesson .name{font-size:.9rem}
.lesson .meta{font-size:.78rem;color:var(--sub);display:flex;gap:10px}
.badge{font-size:.72rem;border-radius:999px;padding:1px 8px}
.badge.pass{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.badge.next{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent)}
.badge.todo{color:var(--sub);border:1px solid color-mix(in srgb,var(--sub) 40%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--surface);border-radius:var(--radius);padding:12px 14px}
.tile .lab{color:var(--sub);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.tile .val{font-family:var(--font-type);font-size:1.7rem;color:var(--text);font-variant-numeric:tabular-nums}
.tile .val small{font-size:.85rem;color:var(--sub);margin-left:4px}
.section{margin-bottom:28px}
.twocol{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.twocol>*{min-width:0}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th{font-weight:400;color:var(--sub);text-align:left;padding:6px 10px;border-bottom:1px solid var(--surface)}
td{padding:6px 10px;border-bottom:1px solid var(--surface);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--font-type)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface)}
.empty{color:var(--sub);background:var(--surface);border-radius:var(--radius);padding:18px;font-size:.92rem}
.prefs{display:flex;flex-direction:column;gap:28px}
.pgroup h2{font-size:1.05rem;font-weight:500;margin:0 0 4px;color:var(--accent)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:12px 0;border-bottom:1px solid var(--surface);align-items:center}
.prow .pl b{font-weight:500;display:block}
.prow .pl span{color:var(--sub);font-size:.85rem;display:block;max-width:60ch}
.seg{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.seg button{padding:6px 12px;border-radius:7px;background:var(--surface);color:var(--sub);font-size:.85rem}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.numin{width:84px;padding:6px 10px;border-radius:7px;border:1px solid var(--surface);background:var(--bg);color:var(--text);font:inherit;text-align:right}
@media (max-width:640px){.prow{grid-template-columns:1fr}.seg{justify-content:flex-start}}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.skin{border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid transparent;font-size:.85rem}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin .dots{display:flex;gap:4px}.skin .dots i{width:12px;height:12px;border-radius:50%}
textarea.big{width:100%;min-height:140px;border-radius:8px;border:1px solid var(--surface);background:var(--bg);color:var(--text);padding:10px;font:14px/1.5 var(--font-type);resize:vertical}

/* overlays */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 55%,rgba(0,0,0,.45));display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:20}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dialog .dh{padding:16px 18px 0;font-weight:500}
.dialog .db{padding:12px 18px 18px;display:flex;flex-direction:column;gap:12px}
.palette input{width:100%;padding:14px 18px;font:inherit;font-size:1rem;background:transparent;border:0;border-bottom:1px solid var(--bg);color:var(--text);outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{padding:8px 12px;border-radius:7px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:.92rem}
.palette li .g{color:var(--sub);min-width:92px;font-size:.82rem}
.palette li.sel{background:var(--bg)}
.palette li .cur{margin-left:auto;color:var(--accent);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:30}
.toast[hidden]{display:none}

.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.gcard{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid transparent}
.gcard:hover{border-color:var(--accent)}
.gcard svg{width:100%;height:auto;border-radius:8px;display:block}
.gtitle{font-size:1.15rem;font-weight:500;padding:4px 4px 0}
.gdesc{color:var(--sub);font-size:.9rem;padding:0 4px}
.gmeta{font-family:var(--font-type);font-size:.8rem;color:var(--accent);padding:0 4px 4px}
.ghead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.ghead h1{font-size:1.3rem;font-weight:500;margin:0}
.ghint{color:var(--sub);font-size:.85rem}
.gwrap{position:relative;width:min(100%,calc((100vh - 200px) * 1.6));margin:0 auto;border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--surface)}
.gwrap canvas{display:block;width:100%;aspect-ratio:16/10;cursor:text}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(2px)}
.gover[hidden]{display:none}
.gover h2{margin:0;font-size:1.8rem;font-weight:500;color:var(--text)}
.gover p{margin:0;color:var(--sub);max-width:46ch}
.gover .gbest{color:var(--accent);font-family:var(--font-type)}
.gover .gscore{font-family:var(--font-type);font-size:3.4rem;color:var(--accent);line-height:1}
.gover .pb{font-size:.8rem;color:var(--bg);background:var(--accent);border-radius:5px;padding:2px 10px}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
body.typing .ghead{opacity:.35}
footer{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;align-items:center;color:var(--sub);font-size:.8rem;padding-top:26px}
footer .keys{display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:var(--font-type);font-size:.75rem;background:var(--surface);color:var(--text);border-radius:4px;padding:1px 6px}
#ti{position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>


<textarea id="ti" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Typing input"></textarea>

<div class="app">
  <header class="fade">
    <a class="brand" href="#" aria-label="Vibe Type, typing test">
      <svg viewBox="0 0 34 28" aria-hidden="true"><rect x="1" y="1" width="32" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><rect x="6" y="6" width="22" height="16" rx="3.5" fill="var(--accent)"/><rect x="13" y="17" width="8" height="2" rx="1" fill="var(--bg)"/></svg>
      <span><b>vibe type</b><small>typing coach</small></span>
    </a>
    <nav aria-label="Pages">
      <a href="#" data-view="type">Type</a>
      <a href="#lessons" data-view="lessons">Lessons</a>
      <a href="#games" data-view="games">Games</a>
      <a href="#progress" data-view="progress">Progress</a>
      <a href="#prefs" data-view="prefs">Preferences</a>

    <div class="hdr-right">

  <main>

      <div id="testArea">

          <div class="capsnote" id="capsNote" hidden>Caps Lock is on</div>
          <div class="wordsbox" id="wordsBox">
            <div class="wordsinner" id="wordsInner"></div>
            <div class="focusnote" id="focusNote" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z"/></svg>
              Click here or press any key to focus
            </div>
          </div>
        </div>
        <div class="restart fade"><button id="restartBtn" title="Restart test (Tab then Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restart</button></div>
        <div id="kbHost"></div>
      </div>
      <div id="resultArea" hidden></div>
    </section>

    <!-- LESSONS -->
    <section class="view" id="v-lessons" hidden></section>
    <!-- GAMES -->
    <section class="view" id="v-games" hidden></section>
    <!-- PROGRESS -->
    <section class="view" id="v-progress" hidden></section>
    <!-- PREFS -->
    <section class="view" id="v-prefs" hidden></section>
  </main>

  <footer class="fade">
    <div class="keys"><span><kbd>tab</kbd> + <kbd>enter</kbd> restart</span><span><kbd>esc</kbd> command line</span><span><kbd>ctrl</kbd> + <kbd>backspace</kbd> delete word</span></div>
    <div id="syncNote">Progress saved in this browser</div>
  </footer>
</div>

<div class="overlay" id="paletteOv" hidden>
  <div class="dialog palette" role="dialog" aria-label="Command line">
    <input id="palIn" placeholder="Type a command, e.g. theme, time 60, lessons" autocomplete="off" spellcheck="false">
    <ul id="palList" role="listbox"></ul>
  </div>
</div>
<div class="overlay" id="customOv" hidden>
  <div class="dialog" role="dialog" aria-label="Custom text">
    <div class="dh">Custom text</div>
    <div class="db">
      <textarea class="big" id="customText" placeholder="Paste anything you want to practise: notes, an email, code, a paragraph from a book."></textarea>
      <label style="display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--sub)"><input type="checkbox" id="customShuffle"> Shuffle the words</label>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="customCancel">Cancel</button><button class="btn primary" id="customGo">Start typing</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
"use strict";
/* ---------- content ---------- */
const EN = "the be of and a to in he have it that for they with as not on she at by this we you do but from or which one would all will there say who make when can more if no man out other so what time up go about than into could state only new year some take come these know see use get like then first any work now may such give over think most even find day also after way many must look before great back through long where much should well people down own just because good each those feel seem how high too place little world very still nation hand old life tell write become here show house both between need mean call develop under last right move thing general school never same another begin while number part turn real leave might want point form off child few small since against ask late home interest large person end open public follow during present without again hold govern around possible head consider word program problem however lead system set order eye plan run keep face fact group play stand increase early course change help line city water family friend money story learn study light night side kind small young letter paper music idea river early north south car book food free full heart field road second door".split(" ");
const CODE = "function return const let var if else for while class import export from async await true false null undefined string number boolean object array map filter reduce push pop length console log error try catch throw new this self def print lambda yield switch case break continue default public private static void int float double char struct enum interface type extends package module require include define select where join insert update delete table index query value key node list dict set get post fetch json http server client data user config test debug commit merge branch render state props hook event target style script".split(" ");
const QUOTES = [
 ["Well done is better than well said.","Benjamin Franklin"],
 ["Brevity is the soul of wit.","William Shakespeare, Hamlet"],
 ["All that glisters is not gold.","William Shakespeare, The Merchant of Venice"],
 ["Arise, awake, and stop not till the goal is reached.","Swami Vivekananda"],
 ["Knowledge is power.","Francis Bacon"],
 ["It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.","Jane Austen, Pride and Prejudice"],
 ["Happy families are all alike; every unhappy family is unhappy in its own way.","Leo Tolstoy, Anna Karenina"],
 ["To believe your own thought, to believe that what is true for you in your private heart is true for all men, that is genius.","Ralph Waldo Emerson, Self-Reliance"],
 ["Four score and seven years ago our fathers brought forth on this continent, a new nation, conceived in Liberty, and dedicated to the proposition that all men are created equal.","Abraham Lincoln, Gettysburg Address"],
 ["\"Would you tell me, please, which way I ought to go from here?\" \"That depends a good deal on where you want to get to,\" said the Cat.","Lewis Carroll, Alice's Adventures in Wonderland"],
 ["Where the mind is without fear and the head is held high; where knowledge is free; where the world has not been broken up into fragments by narrow domestic walls.","Rabindranath Tagore, Gitanjali"],
 ["Call me Ishmael. Some years ago, never mind how long precisely, having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world.","Herman Melville, Moby-Dick"],
 ["I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach, and not, when I came to die, discover that I had not lived.","Henry David Thoreau, Walden"],
 ["It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity, it was the season of Light, it was the season of Darkness, it was the spring of hope, it was the winter of despair.","Charles Dickens, A Tale of Two Cities"]
];
const LESSONS = [
 {k:"fj",name:"Index fingers home"},{k:"dk",name:"Middle fingers home"},{k:"sl",name:"Ring fingers home"},{k:"a;",name:"Pinkies home"},
 {k:"gh",name:"Index stretch"},{k:"ei",name:"Top row: e and i"},{k:"ru",name:"Top row: r and u"},{k:"ty",name:"Top row: t and y"},
 {k:"wo",name:"Top row: w and o"},{k:"qp",name:"Top row: q and p"},{k:"vm",name:"Bottom row: v and m"},{k:"c,",name:"Bottom row: c and comma"},
 {k:"x.",name:"Bottom row: x and period"},{k:"bn",name:"Bottom row: b and n"},{k:"z/",name:"Bottom row: z and slash"},
 {k:"Aa",name:"Capital letters",special:"caps"},{k:"123",name:"Number row",special:"nums"},{k:".,?!",name:"Punctuation",special:"punct"}
];
const SKINS=[["auto","Match system"],["dusk","Dusk"],["daylight","Daylight"],["lagoon","Lagoon"],["plum","Plum"],["forest","Forest"],["sakura","Sakura"],["graphite","Graphite"],["serika","Serika"]];
const SKINDOTS={auto:["#1f2227","#f0a35e","#eef1f4"],dusk:["#1f2227","#f0a35e","#e6e2d8"],daylight:["#eef1f4","#b0501a","#1d2733"],lagoon:["#0f2a2e","#5ad1c0","#dcefee"],plum:["#241b2f","#e9a6d9","#ece3f5"],forest:["#1c231d","#d1bb5c","#e3e8dc"],sakura:["#fbeef2","#b93a63","#3b2530"],graphite:["#111214","#9ecbff","#f2f2f2"],serika:["#323437","#e2b714","#d1d0c5"]};

/* ---------- persisted state ---------- */
const DEF_SETTINGS={mode:"time",time:30,words:25,quote:"all",punct:false,nums:false,wordset:"english",
 difficulty:"normal",stopOnError:"off",confidence:"off",blind:false,freedom:false,indicate:"off",
 caret:"line",smooth:true,pace:"off",paceWpm:60,liveWpm:true,liveAcc:true,keyboard:"next",fontSize:1.75,
 sound:"off",errSound:false,volume:0.5,gameSound:true,reduceFx:false,goalMin:15,lessonWpm:25,lessonAcc:95,skin:"auto"};
const blank=()=>({v:1,updatedAt:0,settings:{...DEF_SETTINGS},results:[],keys:{},lessons:{},days:{},games:{}});
let S=blank();
const LSKEY="vibetype:v1";
try{const raw=localStorage.getItem(LSKEY)||localStorage.getItem("homerow:v1");if(raw){const p=JSON.parse(raw);if(p&&p.v===1){S={...blank(),...p,settings:{...DEF_SETTINGS,...(p.settings||{})}}}}}catch(e){}
const cfg=S.settings;
let remote=null, saveTimer=null, writing=false, pendingWrite=false;
function persist(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200);
}
async function pushRemote(){
  if(!remote)return;
  if(writing){pendingWrite=true;return}
  writing=true;
  try{await remote.set(JSON.parse(JSON.stringify(S)));setSync("Progress saved to your account")}catch(e){setSync("Saved in this browser (account sync unavailable)")}
  writing=false;
  if(pendingWrite){pendingWrite=false;pushRemote()}
}
function setSync(t){$("#syncNote").textContent=t}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.collection("data/users/"+id).doc("state");
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    remote=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.v===1&&(d.updatedAt||0)>(S.updatedAt||0)){
        S={...blank(),...d,settings:{...DEF_SETTINGS,...(d.settings||{})}};
        Object.keys(cfg).forEach(k=>delete cfg[k]);Object.assign(cfg,S.settings);S.settings=cfg;
        try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}
        applySettings();if(!T.started)newTest();refreshHeader();route();
      }else if((S.updatedAt||0)>(d.updatedAt||0)){pushRemote()}
    }else if(S.results.length||S.updatedAt){pushRemote()}
    setSync("Progress saved to your account");
  }catch(e){}
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")n.className=v;else if(k==="text")n.textContent=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?"":v)}kids.flat().forEach(c=>c!=null&&n.append(c));return n};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const r1=x=>Math.round(x*10)/10;
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+"h "+m+"m":m?m+"m "+(s%60)+"s":s+"s"};
let toastT;function toast(t){const n=$("#toast");n.textContent=t;n.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>n.hidden=true,2200)}
function svg(tag,attrs){const n=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);return n}

/* ---------- sound ---------- */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(type,f1,f2,dur,vol){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol*cfg.volume,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,freq,vol){const a=audio();if(!a)return;const t=a.currentTime,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=1.2;const g=a.createGain();g.gain.value=vol*cfg.volume;s.connect(f).connect(g).connect(a.destination);s.start(t)}
function keySound(){switch(cfg.sound){case"click":noise(.03,3200,.9);break;case"beep":tone("sine",880,0,.05,.25);break;case"pop":tone("sine",640,180,.07,.35);break;case"typewriter":noise(.04,1800,1.1);tone("triangle",120,60,.05,.25);break}}
function errSound(){if(cfg.errSound)tone("square",160,110,.09,.12)}

/* ---------- word generation ---------- */
function pool(){return cfg.wordset==="code"?CODE:EN}
function decorate(list,punct,nums){
  const out=[];let cap=true;
  for(let w of list){
    if(nums&&Math.random()<.1){w=String(Math.floor(Math.random()*(Math.random()<.5?100:10000)))}
    else if(punct){
      if(cap)w=w[0].toUpperCase()+w.slice(1);
      cap=false;const r=Math.random();
      if(r<.08){w+=".";cap=true}else if(r<.1){w+="?";cap=true}else if(r<.115){w+="!";cap=true}
      else if(r<.2)w+=",";else if(r<.215)w+=";";else if(r<.225)w+=":";
      else if(r<.245)w="\""+w+"\"";else if(r<.255)w="("+w+")";else if(r<.265)w="'"+w+"'";
    }
    out.push(w);
  }
  if(punct&&out.length&&!/[.?!]$/.test(out[out.length-1]))out[out.length-1]+=".";
  return out;
}
function genWords(n,src=pool()){const o=[];let last="";for(let i=0;i<n;i++){let w;do{w=rnd(src)}while(w===last&&src.length>1);o.push(w);last=w}return o}
function pseudo(letters,focus,n){const o=[];for(let i=0;i<n;i++){const len=2+Math.floor(Math.random()*4);let w="";for(let j=0;j<len;j++){w+=(focus&&Math.random()<.45)?rnd(focus):rnd(letters)}o.push(w)}return o}
function lessonLetters(i){let s="";for(let j=0;j<=Math.min(i,14);j++)s+=LESSONS[j].k;return s}
function lessonWords(i,n=25){
  const L=LESSONS[i];
  if(L.special){const base=genWords(n,EN);if(L.special==="caps")return base.map(w=>Math.random()<.45?w[0].toUpperCase()+w.slice(1):w);if(L.special==="nums")return decorate(base,false,false).map(w=>Math.random()<.35?String(Math.floor(Math.random()*1000)):w);return decorate(base,true,false)}
  const letters=lessonLetters(i).split(""),focus=L.k.split("");
  const real=EN.filter(w=>w.length>1&&[...w].every(c=>letters.includes(c)));
  const realFocus=real.filter(w=>[...w].some(c=>focus.includes(c)));
  const o=[];
  for(let j=0;j<n;j++){
    const r=Math.random();
    if(realFocus.length>=4&&r<.45)o.push(rnd(realFocus));
    else if(real.length>=8&&r<.65)o.push(rnd(real));
    else o.push(pseudo(letters.filter(c=>c!==";"||i===3),focus,1)[0]);
  }
  return o;
}
function keyScore(){
  const out=[];let tot=0,cnt=0;
  for(const[k,v]of Object.entries(S.keys)){if(v.h>0){tot+=v.ms/v.h;cnt++}}
  const avg=cnt?tot/cnt:250;
  for(const[k,v]of Object.entries(S.keys)){
    if(!/^[a-z]$/.test(k))continue;const n=v.h+v.m;if(n<6)continue;
    const miss=v.m/n,ms=v.h?v.ms/v.h:avg;
    out.push({k,acc:1-miss,ms,n,score:miss*100+Math.max(0,ms-avg)/8});
  }
  return out.sort((a,b)=>b.score-a.score);
}
function weakWords(n){
  const weak=keyScore().slice(0,5).map(x=>x.k);
  if(weak.length<2)return {words:null,weak};
  const src=[...EN,...CODE].filter(w=>[...w].some(c=>weak.includes(c)));
  const o=[];for(let i=0;i<n;i++){o.push(Math.random()<.75&&src.length?rnd(src):pseudo("etaoinshrdlu".split(""),weak,1)[0])}
  return {words:o,weak};
}

/* ---------- test engine ---------- */
let T={};
let practice=null; // {kind:'missed'|'weak'|'lesson'|'custom'|'repeat', words, label, lesson}
let lastWords=null;
function testLabel(){
  if(practice&&practice.kind==="lesson")return "lesson "+(practice.lesson+1);
  if(practice)return practice.kind;
  if(cfg.mode==="time")return "time "+cfg.time;if(cfg.mode==="words")return "words "+cfg.words;
  if(cfg.mode==="quote")return "quote "+cfg.quote;return cfg.mode;
}
function newTest(opts={}){
  clearInterval(T.timer);cancelAnimationFrame(T.raf);
  document.body.classList.remove("typing");
  let words,quote=null,mode=cfg.mode;
  if(opts.repeat&&lastWords){words=[...lastWords.words];quote=lastWords.quote;mode=lastWords.mode;practice=lastWords.practice}
  else if(practice){words=[...practice.words];mode="words"}
  else if(mode==="time"){words=decorate(genWords(80),cfg.punct,cfg.nums)}
  else if(mode==="words"){words=decorate(genWords(cfg.words),cfg.punct,cfg.nums)}
  else if(mode==="quote"){const f=QUOTES.filter(([q])=>cfg.quote==="all"||(cfg.quote==="short"?q.length<100:cfg.quote==="medium"?q.length>=100&&q.length<200:q.length>=200));quote=rnd(f.length?f:QUOTES);words=quote[0].split(/\s+/)}
  else if(mode==="zen"){words=[""]}
  T={mode,words,typed:[""],idx:0,started:false,done:false,start:0,events:[],keyOk:0,keyBad:0,lastKey:0,wordStart:[],wordEnd:[],quote,missedIdx:new Set(),pace:0,failed:false};
  lastWords={words:[...words],quote,mode,practice};
  T.pace=paceWpm();
  $("#resultArea").hidden=true;$("#testArea").hidden=false;
  renderConfig();renderBanner();renderWords();updateLive();highlightNext();
  focusInput();
}
function paceWpm(){
  if(cfg.pace==="off")return 0;if(cfg.pace==="custom")return +cfg.paceWpm||0;
  const same=S.results.filter(r=>r.lab===testLabel());
  if(!same.length)return 0;
  if(cfg.pace==="pb")return Math.max(...same.map(r=>r.w));
  const last=same.slice(-10);return last.reduce((a,r)=>a+r.w,0)/last.length;
}
function renderWords(){
  const inner=$("#wordsInner");inner.textContent="";inner.style.transform="";
  T.wordEls=[];
  T.words.forEach((w,i)=>appendWord(w,i));
  const caret=el("div",{class:"caret "+(cfg.caret==="line"?"":cfg.caret)+(cfg.smooth?" smooth":""),id:"caret"});
  inner.append(caret);
  if(T.pace){inner.append(el("div",{class:"pace",id:"paceCaret"}))}
  requestAnimationFrame(()=>{measure();placeCaret()});
}
function appendWord(w,i){
  const d=el("div",{class:"word"});
  for(const c of w)d.append(el("span",{class:"l",text:c}));
  if(!w)d.append(el("span",{class:"l",text:"\u200b"}));
  T.wordEls[i]=d;
  const inner=$("#wordsInner");const caret=$("#caret");
  if(caret)inner.insertBefore(d,caret);else inner.append(d);
}
function measure(){
  const w=T.wordEls[0];if(!w)return;
  const cs=getComputedStyle(w);T.lineH=w.offsetHeight+parseFloat(cs.marginBottom);
  $("#wordsBox").style.height=(T.lineH*3)+"px";
}
function renderWord(i){
  const d=T.wordEls[i];if(!d)return;
  const target=T.mode==="zen"?T.typed[i]:T.words[i],typed=T.typed[i]||"";
  d.textContent="";
  const n=Math.max(target.length,typed.length);
  for(let j=0;j<n;j++){
    const tc=target[j],yc=typed[j];let cls="l",txt=tc;
    if(j>=target.length){cls+=" extra";txt=yc}
    else if(yc!==undefined){if(yc===tc)cls+=" ok";else{cls+=" bad";if(cfg.indicate==="replace")txt=yc}}

function computeStats(){

  let correct=0,raw=0,cOk=0,cBad=0,cExtra=0,cMiss=0;
  const last=T.mode==="zen"?T.idx:Math.min(T.idx,T.words.length-1);
  const hist=[];
  for(let i=0;i<=last;i++){
    const tw=T.mode==="zen"?(T.typed[i]||""):T.words[i],ty=T.typed[i]||"";
    if(i===T.idx&&!ty)break;
    const committed=i<T.idx||(i===T.idx&&ty===tw&&T.mode!=="time");
    raw+=ty.length+(i<T.idx?1:0);
    if(ty===tw&&committed)correct+=tw.length+(i<T.idx?1:0);
    else if(i===T.idx&&tw.startsWith(ty))correct+=ty.length;
    for(let j=0;j<Math.max(tw.length,ty.length);j++){
      if(j>=tw.length)cExtra++;else if(j>=ty.length){if(committed||i<T.idx)cMiss++}else if(ty[j]===tw[j])cOk++;else cBad++;
    }
    hist.push({tw,ty,err:i<T.idx?ty!==tw:false});
  }
  const wpm=correct/5/(dur/60),rawWpm=raw/5/(dur/60);
  const k=T.keyOk+T.keyBad,acc=k?T.keyOk/k*100:0;
  // per second
  const secs=Math.max(1,Math.ceil(dur-1e-6));
  const rawS=Array(secs).fill(0),errS=Array(secs).fill(0),okCum=Array(secs).fill(0);
  for(const e of T.events){const s=Math.min(secs-1,Math.floor((e.t-T.start)/1000));rawS[s]++;if(!e.ok)errS[s]++;else okCum[s]++}

  const missed=[...T.missedIdx].filter(i=>i<=last).map(i=>T.mode==="zen"?T.typed[i]:T.words[i]);
  return {dur,wpm,rawWpm,acc,consistency,chars:[cOk,cBad,cExtra,cMiss],wpmLine,rawLine,errS,hist,missed};
}

  const GAMES={ship:Ship,runner:Runner};
  function resize(){

    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*H/W*dpr);const sc=r.width/W*dpr;ctx.setTransform(sc,0,0,sc,0,0);

  function frame(ts){

    }

  function overlay(kind){

      o.append(el("h2",{text:"Game over"}),el("div",{class:"gscore",text:st.score}),isBest?el("span",{class:"pb",text:"New best"}):el("p",{class:"gbest",text:prevBest?"Best "+g.best:"First score saved"}),

        el("div",{class:"gbtns"},el("button",{class:"btn primary",onclick:()=>start(),text:"Play again  (enter)"}),el("button",{class:"btn",onclick:()=>{stop();renderGames()},text:"All games"})));

  function start(){

    $("#gOver").hidden=true;ti.focus({preventScroll:true});document.body.classList.add("typing");

}

/* ---------- routing ---------- */
let view="type";
function go(name){const h=name==="type"?"":"#"+name;const curH=location.hash==="#"?"":location.hash;if(h!==curH){try{location.hash=h;return}catch(e){}}route()}
function route(){
  const h=location.hash.replace("#","");const prev=view;view=["lessons","games","progress","prefs"].includes(h)?h:"type";if(prev==="games"&&view!=="games")Games.stop();
  document.querySelectorAll("nav a").forEach(a=>{if(a.dataset.view===view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  ["type","lessons","games","progress","prefs"].forEach(v=>$("#v-"+v).hidden=v!==view);
  if(view==="games")renderGames();
  if(view==="lessons")renderLessons();if(view==="progress")renderProgress();if(view==="prefs")renderPrefs();
  if(view==="type"){if(T.done===undefined||(!T.started&&!T.done))newTest();else if(T.done&&!T.stats)newTest();else{requestAnimationFrame(()=>{measure();placeCaret()});focusInput()}}
  checkFocus();
}
document.querySelectorAll("nav a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();if(T.started&&!T.done){T.done=true;clearInterval(T.timer);cancelAnimationFrame(T.raf);T.stats=null;document.body.classList.remove("typing")}go(a.dataset.view)}));

window.addEventListener("resize",()=>{if(view==="type"&&T.wordEls){measure();placeCaret()}});

setInterval(checkFocus,1000);

})();
